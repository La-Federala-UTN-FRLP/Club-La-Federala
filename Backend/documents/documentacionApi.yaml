      - $ref: '#/components/parameters/Id'
    post:
      tags: [Personas]
      operationId: crearMiembroFamiliar
      summary: Agregar un miembro al grupo familiar
      description: >-
        El titular debe ser propietario o inquilino activo (400), no estar eliminado (409) y no ser
        miembro de otra familia (409 "El titular indicado ya es miembro de otro grupo familiar": no hay
        familias anidadas). El miembro hereda la inmobiliaria del titular: si esa inmobiliaria está
        ELIMINADO responde 409 "La inmobiliaria seleccionada no está disponible para operar."
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MiembroFamiliarCrear' }
      responses:
        '201':
          description: Miembro agregado
          content:
            application/json:
              schema:
                type: object
                required: [success, miembro, message]
                properties:
                  success: { type: boolean, enum: [true] }
                  miembro: { $ref: '#/components/schemas/MiembroFamiliarCreado' }
                  message: { type: string, example: Miembro familiar creado exitosamente }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /personas/{id}/grupo-familiar/miembros/{miembroId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: miembroId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/IdPath' }
    delete:
      tags: [Personas]
      operationId: eliminarMiembroFamiliar
      summary: Quitar un miembro del grupo familiar
      description: >-
        Borrado físico del miembro, con los mismos guards que el borrado definitivo de personas: 409 si
        tiene asociaciones (lotes, alquileres, reservas, ventas o co-compras).
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Miembro quitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MensajeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================ INMOBILIARIAS
  /inmobiliarias:
    get:
      tags: [Inmobiliarias]
      operationId: listarInmobiliarias
      summary: Listar inmobiliarias
      description: >-
        Sin `estadoOperativo` devuelve solo las OPERATIVO (uso operativo: selects de asignación). La
        administración consulta las dadas de baja con `estadoOperativo=ELIMINADO`. `total` cuenta todas
        las inmobiliarias, sin aplicar el filtro.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estadoOperativo, in: query, schema: { $ref: '#/components/schemas/EstadoOperativo' } }
      responses:
        '200':
          description: Inmobiliarias
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [inmobiliarias, total]
                    properties:
                      inmobiliarias: { type: array, items: { $ref: '#/components/schemas/InmobiliariaConMetricas' } }
                      total: { type: integer, description: Total de inmobiliarias (sin filtro) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Inmobiliarias]
      operationId: crearInmobiliaria
      summary: Crear inmobiliaria
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InmobiliariaCrear' }
      responses:
        '201':
          description: Inmobiliaria creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InmobiliariaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /inmobiliarias/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Inmobiliarias]
      operationId: obtenerInmobiliaria
      summary: Obtener inmobiliaria
      description: Incluye las dadas de baja (ELIMINADO), para historial y reactivación.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Inmobiliaria
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [inmobiliaria]
                    properties:
                      inmobiliaria: { $ref: '#/components/schemas/InmobiliariaConMetricas' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Inmobiliarias]
      operationId: actualizarInmobiliaria
      summary: Actualizar inmobiliaria
      description: Actualización parcial (al menos un campo). Una inmobiliaria ELIMINADO no se edita (409).
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InmobiliariaActualizar' }
      responses:
        '200':
          description: Inmobiliaria actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InmobiliariaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /inmobiliarias/{id}/eliminar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Inmobiliarias]
      operationId: eliminarInmobiliaria
      summary: Dar de baja una inmobiliaria (baja lógica)
      description: >-
        Pasa a ELIMINADO (409 si ya lo está). Desde ese momento: su usuario no puede iniciar sesión y
        sus tokens dejan de operar (401), no aparece en el listado operativo y no puede asignarse a
        operaciones nuevas (409). Sus reservas, ventas, prioridades y clientes conservan la relación.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Inmobiliaria dada de baja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InmobiliariaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /inmobiliarias/{id}/reactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Inmobiliarias]
      operationId: reactivarInmobiliaria
      summary: Reactivar una inmobiliaria dada de baja
      description: Vuelve a OPERATIVO (409 si ya lo está) y recupera acceso, visibilidad operativa y asignabilidad.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Inmobiliaria reactivada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InmobiliariaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

