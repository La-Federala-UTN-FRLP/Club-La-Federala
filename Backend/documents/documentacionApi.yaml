  # ============================================================ PRIORIDADES
  /prioridades:
    get:
      tags: [Prioridades]
      operationId: listarPrioridades
      summary: Listar prioridades
      description: INMOBILIARIA ve solo las de su inmobiliaria.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoPrioridad' } }
        - { name: estadoOperativo, in: query, schema: { $ref: '#/components/schemas/EstadoOperativo' } }
        - { name: ownerType, in: query, schema: { $ref: '#/components/schemas/OwnerPrioridad' } }
        - { name: inmobiliariaId, in: query, schema: { $ref: '#/components/schemas/IdQuery' } }
        - { name: loteId, in: query, schema: { $ref: '#/components/schemas/IdQuery' } }
        - { name: fechaInicioDesde, in: query, schema: { type: string, format: date-time } }
        - { name: fechaInicioHasta, in: query, schema: { type: string, format: date-time } }
        - { name: fechaFinDesde, in: query, schema: { type: string, format: date-time } }
        - { name: fechaFinHasta, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Prioridades
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [prioridades, total]
                    properties:
                      prioridades: { type: array, items: { $ref: '#/components/schemas/Prioridad' } }
                      total: { type: integer, description: Cantidad devuelta }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Prioridades]
      operationId: crearPrioridad
      summary: Crear prioridad
      description: >-
        INMOBILIARIA crea a nombre de su inmobiliaria, dentro de su cupo de prioridades activas (409).
        Staff define `ownerType` (default CCLF) e `inmobiliariaId`; una inmobiliaria ELIMINADO responde
        409 "La inmobiliaria seleccionada no está disponible para operar." El lote debe estar
        DISPONIBLE o EN_PROMOCION y sin otra prioridad activa (409). La base garantiza una sola
        prioridad ACTIVA por lote: de dos altas concurrentes para el mismo lote entra una y la otra
        responde 409 "Ya existe una prioridad ACTIVA para este lote". Si el lote cambia de estado entre
        la validación y el alta, también 409 y no se crea nada.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrioridadCrear' }
      responses:
        '201':
          description: Prioridad creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrioridadMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /prioridades/jobs/expire:
    post:
      tags: [Prioridades]
      operationId: expirarPrioridades
      summary: Expirar prioridades vencidas (ejecución manual)
      description: >-
        Expira las prioridades ACTIVA cuya `fechaFin` ya pasó. Es la misma operación que ejecuta el job
        programado; sirve para forzarla sin esperar al scheduler. Idempotente.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Expiración ejecutada
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: Se expiraron 2 prioridades }
                  data:
                    type: object
                    required: [expired]
                    properties:
                      expired: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /prioridades/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Prioridades]
      operationId: obtenerPrioridad
      summary: Obtener prioridad
      description: INMOBILIARIA solo prioridades propias (403).
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Prioridad
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/Prioridad' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Prioridades]
      operationId: actualizarPrioridad
      summary: Actualizar prioridad
      description: >-
        INMOBILIARIA solo edita prioridades propias y no puede cambiar `inmobiliariaId` (403). Staff
        puede reasignarla: a una inmobiliaria ELIMINADO responde 409 y sin cupo, 409. Mantener la
        inmobiliaria actual de una prioridad histórica no es una reasignación.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrioridadActualizar' }
      responses:
        '200':
          description: Prioridad actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrioridadMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /prioridades/{id}/cancelar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Prioridades]
      operationId: cancelarPrioridad
      summary: Cancelar prioridad
      description: >-
        Solo prioridades ACTIVA (400). El estado se verifica al escribir: si otra transición (expiración,
        cancelación o finalización) la cerró antes, también responde 400 y no se modifica nada. Restaura el
        lote si sigue CON_PRIORIDAD. INMOBILIARIA solo propias.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Prioridad cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrioridadMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /prioridades/{id}/finalizar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Prioridades]
      operationId: finalizarPrioridad
      summary: Finalizar prioridad
      description: >-
        Solo prioridades ACTIVA (400). El estado se verifica al escribir: si otra transición (expiración,
        cancelación o finalización) la cerró antes, también responde 400 y no se modifica nada. Restaura el
        lote si sigue CON_PRIORIDAD. INMOBILIARIA solo propias.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Prioridad finalizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrioridadMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /prioridades/{id}/eliminar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Prioridades]
      operationId: eliminarPrioridad
      summary: Dar de baja una prioridad (baja lógica)
      description: Marca `estadoOperativo` ELIMINADO (409 si ya lo está o su estado no lo permite). INMOBILIARIA solo propias.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Prioridad dada de baja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrioridadMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /prioridades/{id}/reactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Prioridades]
      operationId: reactivarPrioridad
      summary: Reactivar una prioridad dada de baja
      description: INMOBILIARIA solo propias. 409 si no estaba eliminada.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Prioridad reactivada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrioridadMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================ PERSONAS
  /personas:
    get:
      tags: [Personas]
      operationId: listarPersonas
      summary: Listar personas
      description: >-
        Sin `limit` devuelve el listado completo (sin paginación); `limit` acota la cantidad (las más
        recientes primero) y `total` es siempre la cantidad total que cumple el filtro. INMOBILIARIA
        ve solo sus clientes operativos (se ignoran `view`, `includeInactive` y `estado`).
      x-roles: [ADMINISTRADOR, GESTOR, TECNICO, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [ALL, PROPIETARIOS, INQUILINOS, CLIENTES, MIS_CLIENTES] }
        - { name: q, in: query, description: Búsqueda por nombre, apellido, razón social o identificador, schema: { type: string } }
        - { name: includeInactive, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoOperativo' } }
        - { name: limit, in: query, schema: { $ref: '#/components/schemas/IdQuery' } }
      responses:
        '200':
          description: Personas
          content:
            application/json:
              schema:
                type: object
                required: [success, message, personas, total]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: Personas obtenidas exitosamente }
                  personas: { type: array, items: { $ref: '#/components/schemas/Persona' } }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Personas]
      operationId: crearPersona
      summary: Crear persona
      description: >-
        INMOBILIARIA crea clientes de su inmobiliaria (se ignora `inmobiliariaId`). Staff puede asignar
        `inmobiliariaId` (null = La Federala); una inmobiliaria ELIMINADO responde 409 "La inmobiliaria
        seleccionada no está disponible para operar." Identificador duplicado → 409.
        Grupo familiar plano: `jefeDeFamiliaId` debe existir (400 "El jefe de familia especificado no
        existe") y no ser miembro de otra familia (409 "El titular indicado ya es miembro de otro grupo
        familiar").
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaCrear' }
      responses:
        '201':
          description: Persona creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /personas/cuil/{cuil}:
    parameters:
      - name: cuil
        in: path
        required: true
        description: CUIL de 11 dígitos; se aceptan guiones, puntos y espacios.
        schema: { type: string, example: 20-12345678-3 }
    get:
      tags: [Personas]
      operationId: obtenerPersonaPorCuil
      summary: Buscar persona por CUIL
      x-roles: [ADMINISTRADOR, GESTOR, TECNICO]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /personas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Personas]
      operationId: obtenerPersona
      summary: Obtener persona
      x-roles: [ADMINISTRADOR, GESTOR, TECNICO]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Personas]
      operationId: actualizarPersona
      summary: Actualizar persona
      description: >-
        Actualización parcial (al menos un campo). Una persona eliminada no se edita (409). Reasignar
        `inmobiliariaId` a una inmobiliaria ELIMINADO responde 409; conservar la actual no es una
        reasignación. No modifica el grupo familiar (`jefeDeFamiliaId` se ignora).
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaActualizar' }
      responses:
        '200':
          description: Persona actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Personas]
      operationId: eliminarPersonaDefinitivamente
      summary: Eliminar persona definitivamente
      description: >-
        Borrado físico. 409 si tiene asociaciones (lotes propios o alquilados, alquileres, reservas,
        ventas como comprador principal o co-comprador) o si es titular de un grupo familiar con
        miembros. Una asociación creada mientras corre el borrado también lo impide (409). Solo
        ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Persona eliminada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MensajeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /personas/{id}/desactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Personas]
      operationId: desactivarPersona
      summary: Dar de baja una persona (baja lógica)
      description: 409 si ya está eliminada.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Persona dada de baja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MensajeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /personas/{id}/reactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Personas]
      operationId: reactivarPersona
      summary: Reactivar una persona dada de baja
      description: 409 si no estaba eliminada.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Persona reactivada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /personas/{id}/grupo-familiar:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Personas]
      operationId: obtenerGrupoFamiliar
      summary: Obtener el grupo familiar de un titular
      x-roles: [ADMINISTRADOR, GESTOR, TECNICO]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Grupo familiar
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [success]
                    properties:
                      success: { type: boolean, enum: [true] }
                  - $ref: '#/components/schemas/GrupoFamiliar'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /personas/{id}/grupo-familiar/miembros:
