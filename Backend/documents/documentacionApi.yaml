components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido con POST /auth/login, enviado como `Authorization Bearer`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/IdPath' }
    VentaId:
      name: ventaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/IdPath' }

  responses:
    BadRequest:
      description: >-
        Datos inválidos. Validación de body, params o query → `VALIDATION_ERROR` con `errors[]`.
        Regla de negocio o input inválido detectado por la operación → `BAD_REQUEST`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationErrorResponse'
              - $ref: '#/components/schemas/ErrorResponse'
          examples:
            validacion:
              value:
                success: false
                code: VALIDATION_ERROR
                message: Datos inválidos
                errors: [{ field: id, message: Debe ser un entero positivo }]
            negocio:
              value: { success: false, code: BAD_REQUEST, message: El lote no está disponible para reservar. }
    Unauthorized:
      description: Token ausente, inválido o vencido, o identidad que ya no opera (usuario eliminado o inmobiliaria dada de baja).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthErrorResponse' }
          example: { success: false, code: UNAUTHORIZED, message: Token inválido, error: Token inválido }
    Forbidden:
      description: >-
        Rol no admitido por la ruta (incluye el campo legacy `error`) o regla de autorización de la
        operación (tenant, rol sobre un recurso).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthErrorResponse' }
          example: { success: false, code: FORBIDDEN, message: No tienes permisos para esta acción, error: No tienes permisos para esta acción }
    NotFound:
      description: Recurso inexistente (o ruta inexistente → "Ruta no encontrada").
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: NOT_FOUND, message: Registro no encontrado. }
    Conflict:
      description: >-
        Conflicto con el estado actual. `CONFLICT`: regla de negocio (incluye inmobiliaria ELIMINADO:
        "La inmobiliaria seleccionada no está disponible para operar."). `CONFLICT_UNIQUE` /
        `CONFLICT_FK`: restricción de base de datos no traducida por la operación.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConflictResponse' }
          example: { success: false, code: CONFLICT, message: La inmobiliaria seleccionada no está disponible para operar. }
    PayloadTooLarge:
      description: Body JSON mayor a 1 MB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: PAYLOAD_TOO_LARGE, message: El cuerpo de la solicitud supera el tamaño máximo permitido (1mb). }
    TooManyRequests:
      description: Demasiados intentos fallidos de login (10 cada 15 minutos por cliente).
      headers:
        RateLimit-Policy:
          schema: { type: string }
        RateLimit:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: TOO_MANY_REQUESTS, message: Demasiados intentos de inicio de sesión. Intentá nuevamente más tarde. }
    InternalError:
      description: Error inesperado. El detalle queda solo en el log del servidor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: INTERNAL_ERROR, message: Error interno. }
    FilesInternalError:
      description: Error inesperado en Files. Mismo formato; el mensaje público es propio de la operación.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: INTERNAL_ERROR, message: Error al subir archivo }

  schemas:
    # ------------------------------------------------------------ Errores
    ErrorCode:
      type: string
      enum: [BAD_REQUEST, VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, CONFLICT_UNIQUE, CONFLICT_FK, PAYLOAD_TOO_LARGE, TOO_MANY_REQUESTS, INTERNAL_ERROR]
    ErrorResponse:
      type: object
      required: [success, code, message]
      properties:
        success: { type: boolean, enum: [false] }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: Mensaje público }
    ValidationErrorResponse:
      type: object
      required: [success, code, message, errors]
      properties:
        success: { type: boolean, enum: [false] }
        code: { type: string, enum: [VALIDATION_ERROR] }
        message: { type: string, enum: [Datos inválidos] }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, description: Ruta del campo (vacía si la regla es de todo el objeto) }
              message: { type: string }
    AuthErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              deprecated: true
              description: >-
                Legacy: repite `message`. Lo envían los rechazos de autenticación y de rol de la ruta,
                por compatibilidad con clientes previos. Usar `message`.
    ConflictResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code: { type: string, enum: [CONFLICT, CONFLICT_UNIQUE, CONFLICT_FK] }
    MensajeResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }

    # ------------------------------------------------------------ Tipos base
    IdPath:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: Entero positivo canónico (sin ceros a la izquierda, signo, decimales ni exponente).
    IdQuery:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Entero positivo canónico (máximo 2147483647).
    IdEntrada:
      description: Id entero positivo; se acepta también como string decimal canónico ("12").
      oneOf:
        - { type: integer, minimum: 1, maximum: 2147483647 }
        - { type: string, pattern: '^[1-9][0-9]*$' }
    NumeroEntrada:
      description: Número; se acepta también como string decimal ("1500.50").
      oneOf:
        - { type: number }
        - { type: string, pattern: '^-?[0-9]+(\.[0-9]+)?$' }
    FechaEntrada:
      type: string
      format: date-time
      description: Fecha parseable (ISO 8601 recomendado).
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Decimal serializado como string (p. ej. "15000.5").
      example: '15000.5'

    # ------------------------------------------------------------ Enums
    Rol: { type: string, enum: [ADMINISTRADOR, GESTOR, INMOBILIARIA, TECNICO] }
    EstadoOperativo: { type: string, enum: [OPERATIVO, ELIMINADO] }
    EstadoLote:
      type: string
      description: Estado del lote en las respuestas.
      enum: [DISPONIBLE, RESERVADO, VENDIDO, NO_DISPONIBLE, EN_PROMOCION, CON_PRIORIDAD, ALQUILADO, OPERATIVO, ELIMINADO]
    EstadoLoteEntrada:
      type: string
      description: Estado del lote en requests y filtros.
      enum: [Disponible, Reservado, Vendido, No Disponible, En Promoción]
    SubestadoLote: { type: string, enum: [CONSTRUIDO, NO_CONSTRUIDO, EN_CONSTRUCCION] }
    SubestadoLoteEntrada: { type: string, enum: [En Construccion, No Construido, Construido] }
    TipoLote: { type: string, enum: [LOTE_VENTA, ESPACIO_COMUN] }
    TipoLoteEntrada: { type: string, enum: [Lote Venta, Espacio Comun] }
    Ocupacion: { type: string, enum: [ALQUILADO, NO_ALQUILADO] }
    NombreCalle: { type: string, enum: [REINAMORA, MACA, ZORZAL, CAUQUEN, ALONDRA, JACANA, TACUARITO, JILGUERO, GOLONDRINA, CALANDRIA, AGUILAMORA, LORCA, MILANO] }
    CalleUbicacion:
      type: string
      enum: [Reinamora, Maca, Zorzal, Cauquén, Alondra, Jacana, Tacuarito, Jilguero, Golondrina, Calandria, Aguilamora, Lorca, Milano]
    EstadoReserva: { type: string, enum: [ACTIVA, CANCELADA, ACEPTADA, RECHAZADA, CONTRAOFERTA, EXPIRADA] }
    EstadoPrioridad: { type: string, enum: [ACTIVA, CANCELADA, FINALIZADA, EXPIRADA] }
    OwnerPrioridad: { type: string, enum: [INMOBILIARIA, CCLF] }
    EstadoVenta: { type: string, enum: [INICIADA, CON_BOLETO, ESCRITURADO, CANCELADA] }
    EstadoCobro: { type: string, enum: [PENDIENTE, EN_CURSO, PAGO_COMPLETO] }
    TipoArchivo: { type: string, enum: [BOLETO, ESCRITURA, PLANO, IMAGEN, OTRO] }
    EstadoAprobacion: { type: string, enum: [PENDIENTE, APROBADO, RECHAZADO] }
    IdentificadorTipo: { type: string, enum: [DNI, CUIL, CUIT, PASAPORTE, OTRO] }
    TipoFinanciacion: { type: string, enum: [CONTADO, ANTICIPO_CUOTAS, CUOTAS_FIJAS, PERSONALIZADO] }
    Moneda: { type: string, enum: [ARS, USD] }
    TipoCuota: { type: string, enum: [ANTICIPO, CUOTA, OTRO] }
    EstadoCuota: { type: string, enum: [PENDIENTE, PAGO_PARCIAL, PAGA] }
    MedioPago: { type: string, enum: [EFECTIVO, TRANSFERENCIA, DEPOSITO, CHEQUE, OTRO] }
    EstadoPlanPago: { type: string, enum: [VIGENTE, REEMPLAZADO, CANCELADO] }

    # ------------------------------------------------------------ Auth
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, description: Se normaliza (trim y minúsculas) }
        password: { type: string, minLength: 6 }
    LoginData:
      type: object
      required: [user, token]
      properties:
        token: { type: string, description: JWT para el header Authorization Bearer }
        user:
          type: object
          required: [id, username, email, role, createdAt, inmobiliariaId, inmobiliariaNombre]
          properties:
            id: { type: integer }
            username: { type: string }
            email: { type: string }
            role: { $ref: '#/components/schemas/Rol' }
            createdAt: { type: string, format: date-time }
            inmobiliariaId: { type: integer, nullable: true }
            inmobiliariaNombre: { type: string, nullable: true }

    # ------------------------------------------------------------ Lotes
    LoteCrear:
      type: object
      required: [numero, fraccionId, subestado, tipo, propietarioId]
      properties:
        numero: { $ref: '#/components/schemas/NumeroEntrada' }
        fraccionId: { $ref: '#/components/schemas/IdEntrada' }
        numPartido: { allOf: [{ $ref: '#/components/schemas/NumeroEntrada' }], description: Default 62 }
        superficie: { $ref: '#/components/schemas/NumeroEntrada' }
        estado: { $ref: '#/components/schemas/EstadoLoteEntrada' }
        subestado: { $ref: '#/components/schemas/SubestadoLoteEntrada' }
        tipo: { $ref: '#/components/schemas/TipoLoteEntrada' }
        precio: { $ref: '#/components/schemas/NumeroEntrada' }
        ocupacion: { $ref: '#/components/schemas/Ocupacion' }
        alquiler: { type: boolean, deprecated: true, description: Legacy; usar `ocupacion` }
        deuda: { type: boolean }
        nombreEspacioComun: { type: string, maxLength: 100 }
        capacidad: { $ref: '#/components/schemas/NumeroEntrada' }
        descripcion: { type: string }
        propietarioId: { $ref: '#/components/schemas/IdEntrada' }
        inquilinoId: { $ref: '#/components/schemas/IdEntrada' }
        ubicacionId: { $ref: '#/components/schemas/IdEntrada' }
        calle: { $ref: '#/components/schemas/NombreCalle' }
        numeroCalle: { $ref: '#/components/schemas/NumeroEntrada' }
    LoteActualizar:
      type: object
      minProperties: 1
      description: Mismos campos que LoteCrear, todos opcionales.
      properties:
        numero: { $ref: '#/components/schemas/NumeroEntrada' }
        fraccionId: { $ref: '#/components/schemas/IdEntrada' }
        numPartido: { $ref: '#/components/schemas/NumeroEntrada' }
        superficie: { $ref: '#/components/schemas/NumeroEntrada' }
        estado: { $ref: '#/components/schemas/EstadoLoteEntrada' }
        subestado: { $ref: '#/components/schemas/SubestadoLoteEntrada' }
        tipo: { $ref: '#/components/schemas/TipoLoteEntrada' }
        precio: { $ref: '#/components/schemas/NumeroEntrada' }
        ocupacion: { $ref: '#/components/schemas/Ocupacion' }
        alquiler: { type: boolean, deprecated: true }
        deuda: { type: boolean }
        nombreEspacioComun: { type: string, maxLength: 100 }
        capacidad: { $ref: '#/components/schemas/NumeroEntrada' }
        descripcion: { type: string }
        propietarioId: { $ref: '#/components/schemas/IdEntrada' }
        inquilinoId: { $ref: '#/components/schemas/IdEntrada' }
        ubicacionId: { $ref: '#/components/schemas/IdEntrada' }
        calle: { $ref: '#/components/schemas/NombreCalle' }
        numeroCalle: { $ref: '#/components/schemas/NumeroEntrada' }
    Lote:
      type: object
      description: >-
        Lote con sus relaciones de presentación (ubicación, propietario, fracción, alquiler activo,
        promoción). Para TECNICO no incluye `deuda`, ventas ni reservas.
      required: [id, tipo, estado, subestado, numPartido, fraccionId, propietarioId, createdAt]
      properties:
        id: { type: integer }
        numero: { type: integer, nullable: true }
        mapId: { type: string, nullable: true }
        tipo: { $ref: '#/components/schemas/TipoLote' }
        descripcion: { type: string, nullable: true }
        estado: { $ref: '#/components/schemas/EstadoLote' }
        subestado: { $ref: '#/components/schemas/SubestadoLote' }
        fondo: { allOf: [{ $ref: '#/components/schemas/Decimal' }], nullable: true }
        frente: { allOf: [{ $ref: '#/components/schemas/Decimal' }], nullable: true }
        superficie: { allOf: [{ $ref: '#/components/schemas/Decimal' }], nullable: true }
        precio: { allOf: [{ $ref: '#/components/schemas/Decimal' }], nullable: true }
        numPartido: { type: integer }
        alquiler: { type: boolean, nullable: true }
        deuda: { type: boolean, nullable: true }
        nombreEspacioComun: { type: string, nullable: true }
        capacidad: { type: integer, nullable: true }
        fraccionId: { type: integer }
        propietarioId: { type: integer }
        inquilinoId: { type: integer, nullable: true }
        ocupacion: { $ref: '#/components/schemas/Ocupacion' }
        createdAt: { type: string, format: date-time }
        updateAt: { type: string, format: date-time, nullable: true }
    LoteMutacionResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/Lote' }

    # ------------------------------------------------------------ Promociones
    PromocionAplicar:
      type: object
      required: [precioPromocional]
      properties:
        precioPromocional: { $ref: '#/components/schemas/NumeroEntrada' }
        fin: { type: string, format: date-time, nullable: true, description: Futura; vacía o null = sin fin }
        explicacion: { type: string, maxLength: 500, nullable: true }
    Promocion:
      type: object
      required: [id, loteId, precioAnterior, precioPromocional, estadoAnterior, inicio, activa]
      properties:
        id: { type: integer }
        loteId: { type: integer }
        precioAnterior: { $ref: '#/components/schemas/Decimal' }
        precioPromocional: { $ref: '#/components/schemas/Decimal' }
        estadoAnterior: { $ref: '#/components/schemas/EstadoLote' }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time, nullable: true }
        activa: { type: boolean }
        explicacion: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PromocionMutacionResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/Promocion' }

    # ------------------------------------------------------------ Reservas
    ReservaCrear:
      type: object
      required: [fechaReserva, loteId, clienteId, numero, ofertaInicial, fechaFinReserva]
      properties:
        fechaReserva: { $ref: '#/components/schemas/FechaEntrada' }
        loteId: { $ref: '#/components/schemas/IdEntrada' }
        clienteId: { $ref: '#/components/schemas/IdEntrada' }
        inmobiliariaId:
          allOf: [{ $ref: '#/components/schemas/IdEntrada' }]
          nullable: true
          description: null o ausente = La Federala. Ignorado para INMOBILIARIA.
        sena: { allOf: [{ $ref: '#/components/schemas/NumeroEntrada' }], nullable: true }
        numero: { type: string, minLength: 3, maxLength: 30 }
        ofertaInicial: { $ref: '#/components/schemas/NumeroEntrada' }
        fechaFinReserva: { $ref: '#/components/schemas/FechaEntrada' }
    ReservaActualizar:
      type: object
      minProperties: 1
      properties:
        fechaReserva: { $ref: '#/components/schemas/FechaEntrada' }
        loteId: { allOf: [{ $ref: '#/components/schemas/IdEntrada' }], description: No se puede cambiar (400) }
        clienteId: { $ref: '#/components/schemas/IdEntrada' }
        inmobiliariaId:
          allOf: [{ $ref: '#/components/schemas/IdEntrada' }]
          nullable: true
          description: No se puede cambiar (400)
        sena: { allOf: [{ $ref: '#/components/schemas/NumeroEntrada' }], nullable: true, description: null quita la seña }
        estado: { $ref: '#/components/schemas/EstadoReserva' }
        numero: { type: string, minLength: 3, maxLength: 30 }
        fechaFinReserva: { $ref: '#/components/schemas/FechaEntrada' }
    Reserva:
      type: object
      description: Reserva con sus relaciones de presentación (cliente, inmobiliaria, lote).
      required: [id, numero, fechaReserva, estado, estadoOperativo, loteId, clienteId, ofertaInicial, ofertaActual, fechaFinReserva, createdAt]
      properties:
        id: { type: integer }
        numero: { type: string }
        fechaReserva: { type: string, format: date-time }
        estado: { $ref: '#/components/schemas/EstadoReserva' }
        estadoPrevio: { allOf: [{ $ref: '#/components/schemas/EstadoReserva' }], nullable: true }
        estadoOperativo: { $ref: '#/components/schemas/EstadoOperativo' }
        fechaBaja: { type: string, format: date-time, nullable: true }
        loteId: { type: integer }
        clienteId: { type: integer }
        inmobiliariaId: { type: integer, nullable: true, description: null = La Federala }
        sena: { allOf: [{ $ref: '#/components/schemas/Decimal' }], nullable: true }
        ofertaInicial: { $ref: '#/components/schemas/Decimal' }
        ofertaActual: { $ref: '#/components/schemas/Decimal' }
        fechaFinReserva: { type: string, format: date-time }
        loteEstadoAlCrear: { $ref: '#/components/schemas/EstadoLote' }
        ventaId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReservaMutacionResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/Reserva' }
    OfertaCrear:
      type: object
      required: [monto]
      properties:
        monto: { $ref: '#/components/schemas/NumeroEntrada' }
        motivo: { type: string }
        action: { type: string, enum: [CONTRAOFERTAR, ACEPTAR, RECHAZAR] }
    OfertaReserva:
      type: object
      required: [id, reservaId, monto, nombreEfector, ownerType, createdAt]
      properties:
        id: { type: integer }
        reservaId: { type: integer }
        monto: { $ref: '#/components/schemas/Decimal' }
        motivo: { type: string, nullable: true }
        nombreEfector: { type: string }
        efectorId: { type: integer, nullable: true }
        ownerType: { $ref: '#/components/schemas/OwnerPrioridad' }
        createdAt: { type: string, format: date-time }

    # ------------------------------------------------------------ Ventas
    CompradorEntrada:
      type: object
      required: [personaId]
      properties:
        personaId: { $ref: '#/components/schemas/IdEntrada' }
    VentaCrear:
      type: object
      required: [loteId, fechaVenta, monto, tipoPago, numero]
      description: >-
        Requiere `compradores[]` o `compradorId`. ESCRITURADO exige `fechaEscrituraReal`; CANCELADA exige
        `fechaCancelacion` y `motivoCancelacion`.
      properties:
        loteId: { $ref: '#/components/schemas/IdEntrada' }
        fechaVenta: { $ref: '#/components/schemas/FechaEntrada' }
        monto: { $ref: '#/components/schemas/NumeroEntrada' }
        estado: { $ref: '#/components/schemas/EstadoVenta' }
        estadoCobro: { $ref: '#/components/schemas/EstadoCobro' }
        plazoEscritura: { $ref: '#/components/schemas/FechaEntrada' }
        fechaEscrituraReal: { $ref: '#/components/schemas/FechaEntrada' }
        fechaCancelacion: { $ref: '#/components/schemas/FechaEntrada' }
        motivoCancelacion: { type: string, minLength: 1 }
        tipoPago: { type: string, minLength: 1 }
        compradorId: { allOf: [{ $ref: '#/components/schemas/IdEntrada' }], deprecated: true, description: Legacy; usar `compradores` }
        compradores: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CompradorEntrada' } }
        inmobiliariaId: { allOf: [{ $ref: '#/components/schemas/IdEntrada' }], description: Ausente = La Federala }
        reservaId: { allOf: [{ $ref: '#/components/schemas/IdEntrada' }], nullable: true }
        numero: { type: string, minLength: 3, maxLength: 30 }
    VentaActualizar:
      type: object
      minProperties: 1
      properties:
        loteId: { $ref: '#/components/schemas/IdEntrada' }
        fechaVenta: { $ref: '#/components/schemas/FechaEntrada' }
        monto: { $ref: '#/components/schemas/NumeroEntrada' }
        estado: { $ref: '#/components/schemas/EstadoVenta' }
        estadoCobro: { $ref: '#/components/schemas/EstadoCobro' }
        plazoEscritura: { $ref: '#/components/schemas/FechaEntrada' }
        fechaEscrituraReal: { $ref: '#/components/schemas/FechaEntrada' }
        fechaCancelacion: { $ref: '#/components/schemas/FechaEntrada' }
        motivoCancelacion: { type: string, minLength: 1 }
        tipoPago: { type: string, minLength: 1 }
        compradorId: { allOf: [{ $ref: '#/components/schemas/IdEntrada' }], deprecated: true }
        compradores: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CompradorEntrada' } }
        inmobiliariaId: { $ref: '#/components/schemas/IdEntrada' }
        numero: { type: string, minLength: 3, maxLength: 30 }
    Venta:
      type: object
      description: Venta con sus relaciones de presentación (lote, compradores, inmobiliaria).
      required: [id, numero, loteId, fechaVenta, monto, estado, estadoOperativo, estadoCobro, tipoPago, compradorId, createdAt]
      properties:
        id: { type: integer }
        numero: { type: string }
        loteId: { type: integer }
        fechaVenta: { type: string, format: date-time }
        monto: { $ref: '#/components/schemas/Decimal' }
        estado: { $ref: '#/components/schemas/EstadoVenta' }
        estadoPrevio: { allOf: [{ $ref: '#/components/schemas/EstadoVenta' }], nullable: true }
        estadoOperativo: { $ref: '#/components/schemas/EstadoOperativo' }
        fechaBaja: { type: string, format: date-time, nullable: true }
        estadoCobro: { $ref: '#/components/schemas/EstadoCobro' }
        plazoEscritura: { type: string, format: date-time, nullable: true }
        fechaEscrituraReal: { type: string, format: date-time, nullable: true }
        fechaCancelacion: { type: string, format: date-time, nullable: true }
        motivoCancelacion: { type: string, nullable: true }
        tipoPago: { type: string }
        compradorId: { type: integer }
        inmobiliariaId: { type: integer, nullable: true, description: null = La Federala }
        createdAt: { type: string, format: date-time }
        updateAt: { type: string, format: date-time, nullable: true }
    VentaListaResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Venta' } }
    VentaMutacionResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/Venta' }

    # ------------------------------------------------------------ Pagos
    CuotaEntrada:
      type: object
      required: [numeroCuota, tipoCuota, fechaVencimiento, montoOriginal]
      properties:
        numeroCuota: { $ref: '#/components/schemas/NumeroEntrada' }
        tipoCuota: { $ref: '#/components/schemas/TipoCuota' }
        fechaVencimiento: { $ref: '#/components/schemas/FechaEntrada' }
        montoOriginal: { $ref: '#/components/schemas/NumeroEntrada' }
        descripcion: { type: string }
    PlanPagoCrear:
      type: object
      required: [nombre, tipoFinanciacion, cantidadCuotas, fechaInicio, cuotas, moneda, montoTotalPlanificado]
      description: >-
        `cantidadCuotas` debe coincidir con `cuotas.length`, sin números repetidos ni vencimientos
        anteriores a `fechaInicio`. CONTADO no admite anticipo; ANTICIPO_CUOTAS lo exige (> 0 y menor al total).
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        tipoFinanciacion: { $ref: '#/components/schemas/TipoFinanciacion' }
        moneda: { $ref: '#/components/schemas/Moneda' }
        montoTotalPlanificado: { $ref: '#/components/schemas/NumeroEntrada' }
        cantidadCuotas: { $ref: '#/components/schemas/NumeroEntrada' }
        fechaInicio: { $ref: '#/components/schemas/FechaEntrada' }
        cuotas: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CuotaEntrada' } }
        descripcion: { type: string }
        montoAnticipo: { $ref: '#/components/schemas/NumeroEntrada' }
        observaciones: { type: string }
    PlanPagoReemplazar:
      type: object
      required: [nombre, tipoFinanciacion, cantidadCuotas, fechaInicio, cuotas]
      description: Mismas reglas de cuotas que PlanPagoCrear; el total lo fija el saldo pendiente real.
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        tipoFinanciacion: { $ref: '#/components/schemas/TipoFinanciacion' }
        moneda: { $ref: '#/components/schemas/Moneda' }
        cantidadCuotas: { $ref: '#/components/schemas/NumeroEntrada' }
        fechaInicio: { $ref: '#/components/schemas/FechaEntrada' }
        cuotas: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CuotaEntrada' } }
        descripcion: { type: string }
        montoAnticipo: { $ref: '#/components/schemas/NumeroEntrada' }
        observaciones: { type: string }
    PagoRegistrar:
      type: object
      required: [cuotaId, fechaPago, monto, medioPago]
      properties:
        cuotaId: { $ref: '#/components/schemas/IdEntrada' }
        fechaPago: { $ref: '#/components/schemas/FechaEntrada' }
        monto: { $ref: '#/components/schemas/NumeroEntrada' }
        medioPago: { $ref: '#/components/schemas/MedioPago' }
        referencia: { type: string }
        observacion: { type: string }
    RecargoAplicar:
      type: object
      required: [cuotaId, montoRecargo]
      properties:
        cuotaId: { $ref: '#/components/schemas/IdEntrada' }
        montoRecargo: { $ref: '#/components/schemas/NumeroEntrada' }
    CuotaPago:
      type: object
      description: Cuota con montos como number.
      properties:
        id: { type: integer }
        numeroCuota: { type: integer }
        tipoCuota: { $ref: '#/components/schemas/TipoCuota' }
        fechaVencimiento: { type: string, format: date-time }
        montoOriginal: { type: number }
        montoRecargoManual: { type: number }
        montoTotalExigible: { type: number }
        montoPagado: { type: number }
        saldoPendiente: { type: number }
        estadoCuota: { $ref: '#/components/schemas/EstadoCuota' }
    PlanPagoResumen:
      type: object
      description: Plan con montos como number.
      required: [id, nombre, estadoPlan, tipoFinanciacion, moneda, cantidadCuotas, montoTotalPlanificado, montoFinanciado, montoAnticipo, fechaInicio, version]
      properties:
        id: { type: integer }
        nombre: { type: string }
        estadoPlan: { $ref: '#/components/schemas/EstadoPlanPago' }
        tipoFinanciacion: { $ref: '#/components/schemas/TipoFinanciacion' }
        moneda: { $ref: '#/components/schemas/Moneda' }
        cantidadCuotas: { type: integer }
        montoTotalPlanificado: { type: number }
        montoFinanciado: { type: number }
        montoAnticipo: { type: number }
        fechaInicio: { type: string, format: date-time }
        version: { type: integer }
        descripcion: { type: string, nullable: true }
        observaciones: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true }
    PlanPagoPersistido:
      type: object
      description: Plan tal como queda en la base, con sus cuotas. Montos Decimal como string.
      required: [id, nombre, estadoPlan, tipoFinanciacion, moneda, cantidadCuotas, montoTotalPlanificado, montoFinanciado, montoAnticipo, fechaInicio]
      properties:
        id: { type: integer }
        nombre: { type: string }
        estadoPlan: { $ref: '#/components/schemas/EstadoPlanPago' }
        tipoFinanciacion: { $ref: '#/components/schemas/TipoFinanciacion' }
        moneda: { $ref: '#/components/schemas/Moneda' }
        cantidadCuotas: { type: integer }
        montoTotalPlanificado: { $ref: '#/components/schemas/Decimal' }
        montoFinanciado: { $ref: '#/components/schemas/Decimal' }
        montoAnticipo: { $ref: '#/components/schemas/Decimal' }
        fechaInicio: { type: string, format: date-time }
    ContextoPagos:
      type: object
      description: Montos como number.
      required: [venta, planVigente, cuotas, pagos, resumen, planificacion]
      properties:
        venta:
          type: object
          properties:
            id: { type: integer }
            numero: { type: string }
            fechaVenta: { type: string, format: date-time }
            monto: { type: number }
            estado: { $ref: '#/components/schemas/EstadoVenta' }
            estadoCobro: { $ref: '#/components/schemas/EstadoCobro' }
        planVigente:
          allOf: [{ $ref: '#/components/schemas/PlanPagoResumen' }]
          nullable: true
        cuotas: { type: array, items: { $ref: '#/components/schemas/CuotaPago' } }
        pagos:
          type: array
          description: Pagos registrados y la seña de la reserva de origen, del más reciente al más antiguo.
          items:
            type: object
            properties:
              monto: { type: number }
              fechaPago: { type: string, format: date-time }
              esPagoPrevioReserva: { type: boolean }
        planesHistoricos: { type: array, items: { type: object } }
        resumen:
          type: object
          properties:
            montoTotalPlanificado: { type: number }
            montoTotalPagado: { type: number }
            saldoPendienteTotal: { type: number }
            cantidadCuotas: { type: integer }
            cuotasPagas: { type: integer }
            cuotasPendientes: { type: integer }
            cuotasVencidas: { type: integer }
        planificacion:
          type: object
          properties:
            montoVenta: { type: number }
            montoSenaReserva: { type: number }
            saldoAPlanificar: { type: number }
    PagoRegistrado:
      type: object
      description: Montos como number.
      required: [pago, cuota, resumen]
      properties:
        pago:
          type: object
          properties:
            id: { type: integer }
            cuotaId: { type: integer }
            fechaPago: { type: string, format: date-time }
            monto: { type: number }
            medioPago: { $ref: '#/components/schemas/MedioPago' }
        cuota: { $ref: '#/components/schemas/CuotaPago' }
        resumen:
          type: object
          properties:
            montoTotalPagado: { type: number }
            saldoPendienteTotal: { type: number }
            cuotasPagas: { type: integer }
            cuotasPendientes: { type: integer }
            cuotasVencidas: { type: integer }
    ReemplazoPlanResultado:
      type: object
      description: Montos como number.
      required: [planAnterior, planNuevo, cuotas, saldoPendienteRealUsado, versionAnterior, versionNueva, monedaAplicada]
      properties:
        planAnterior: { type: object }
        planNuevo: { $ref: '#/components/schemas/PlanPagoResumen' }
        cuotas: { type: array, items: { $ref: '#/components/schemas/CuotaPago' } }
        saldoPendienteRealUsado: { type: number }
        versionAnterior: { type: integer }
        versionNueva: { type: integer }
        monedaAplicada: { $ref: '#/components/schemas/Moneda' }

    # ------------------------------------------------------------ Files
    ArchivoSubir:
      type: object
      required: [file, idLoteAsociado, tipo]
      properties:
        file: { type: string, format: binary, description: PDF, JPG/JPEG, PNG o WebP; máx. 20 MB }
        idLoteAsociado: { $ref: '#/components/schemas/IdQuery' }
        tipo: { $ref: '#/components/schemas/TipoArchivo' }
        ventaId:
          allOf: [{ $ref: '#/components/schemas/IdQuery' }]
          description: Obligatorio para BOLETO, ESCRITURA y OTRO; no admitido para PLANO e IMAGEN.
    Archivo:
      type: object
      required: [id, filename, url, tipo, uploadedAt, idLoteAsociado, ventaId, estadoOperativo]
      properties:
        id: { type: integer }
        filename: { type: string }
        url:
          type: string
          description: Ruta interna del objeto en el storage. No es una URL de descarga; usar POST /files/{id}/url.
        tipo: { $ref: '#/components/schemas/TipoArchivo' }
        uploadedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        uploadedBy: { type: string, nullable: true }
        idLoteAsociado: { type: integer }
        ventaId: { type: integer, nullable: true }
        ventaNumero: { type: string, nullable: true }
        estadoOperativo: { $ref: '#/components/schemas/EstadoOperativo' }
        fechaBaja: { type: string, format: date-time, nullable: true }
        deletedBy: { type: string, nullable: true }
        estadoAprobacionComision: { allOf: [{ $ref: '#/components/schemas/EstadoAprobacion' }], nullable: true }
        fechaAprobacionComision: { type: string, format: date-time, nullable: true }
        aprobadoComisionBy: { type: string, nullable: true }
        observacionAprobacionComision: { type: string, nullable: true }
        estadoAprobacionMunicipio: { allOf: [{ $ref: '#/components/schemas/EstadoAprobacion' }], nullable: true }
        fechaAprobacionMunicipio: { type: string, format: date-time, nullable: true }
        aprobadoMunicipioBy: { type: string, nullable: true }
        observacionAprobacionMunicipio: { type: string, nullable: true }
    ArchivoMutacionResponse:
      type: object
      required: [message, data]
      description: Files no incluye `success` en sus respuestas exitosas.
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/Archivo' }
    AprobacionActualizar:
      type: object
      required: [target, estado]
      properties:
        target: { type: string, enum: [COMISION, MUNICIPIO] }
        estado: { $ref: '#/components/schemas/EstadoAprobacion' }
        observacion: { type: string, maxLength: 500 }
    UrlFirmada:
      type: object
      required: [signedUrl, signedURL, expiresAt]
      properties:
        signedUrl: { type: string, format: uri }
        signedURL: { type: string, format: uri, deprecated: true, description: Legacy; repite signedUrl }
        expiresAt: { type: string, format: date-time }

    # ------------------------------------------------------------ Prioridades
    PrioridadCrear:
      type: object
      required: [numero, loteId, fechaInicio, fechaFin]
      description: fechaFin debe ser posterior a fechaInicio y a la fecha actual.
      properties:
        numero: { type: string, minLength: 1 }
        loteId: { $ref: '#/components/schemas/IdEntrada' }
        fechaInicio: { $ref: '#/components/schemas/FechaEntrada' }
        fechaFin: { $ref: '#/components/schemas/FechaEntrada' }
        ownerType: { allOf: [{ $ref: '#/components/schemas/OwnerPrioridad' }], description: Solo staff; default CCLF }
        inmobiliariaId:
          allOf: [{ $ref: '#/components/schemas/IdEntrada' }]
          nullable: true
          description: Solo staff con ownerType INMOBILIARIA. Ignorado para INMOBILIARIA.
    PrioridadActualizar:
      type: object
      minProperties: 1
      properties:
        numero: { type: string, minLength: 1 }
        inmobiliariaId:
          allOf: [{ $ref: '#/components/schemas/IdEntrada' }]
          nullable: true
          description: Solo staff; null la pasa a CCLF.
        fechaFin: { allOf: [{ $ref: '#/components/schemas/FechaEntrada' }], description: Posterior a la fecha actual }
    Prioridad:
      type: object
      description: Prioridad con su lote e inmobiliaria de presentación. No tiene campos Decimal.
      required: [id, numero, loteId, estado, estadoOperativo, ownerType, fechaInicio, fechaFin, createdAt]
      properties:
        id: { type: integer }
        numero: { type: string }
        loteId: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoPrioridad' }
        estadoOperativo: { $ref: '#/components/schemas/EstadoOperativo' }
        ownerType: { $ref: '#/components/schemas/OwnerPrioridad' }
        inmobiliariaId: { type: integer, nullable: true, description: null cuando el dueño es CCLF }
        fechaInicio: { type: string, format: date-time }
        fechaFin: { type: string, format: date-time }
        loteEstadoAlCrear: { $ref: '#/components/schemas/EstadoLote' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PrioridadMutacionResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/Prioridad' }

    # ------------------------------------------------------------ Personas
    PersonaCrear:
      type: object
      required: [identificadorTipo, identificadorValor]
      description: >-
        Requiere `razonSocial` (persona jurídica) o `nombre` y `apellido` (persona física). Formato del
        identificador: DNI 8 dígitos; CUIL/CUIT 11 dígitos (se quitan guiones); PASAPORTE 6 a 9
        caracteres alfanuméricos en mayúscula.
      properties:
        identificadorTipo: { $ref: '#/components/schemas/IdentificadorTipo' }
        identificadorValor: { type: string, minLength: 1 }
        nombre: { type: string, maxLength: 100 }
        apellido: { type: string, maxLength: 100 }
        razonSocial: { type: string, maxLength: 200 }
        telefono: { type: integer, minimum: 1 }
        email: { type: string, format: email }
        jefeDeFamiliaId: { $ref: '#/components/schemas/IdEntrada' }
        inmobiliariaId:
          allOf: [{ $ref: '#/components/schemas/IdEntrada' }]
          nullable: true
          description: Solo staff; null = La Federala. Ignorado para INMOBILIARIA.
    PersonaActualizar:
      type: object
      minProperties: 1
      description: identificadorTipo e identificadorValor deben venir juntos.
      properties:
        identificadorTipo: { $ref: '#/components/schemas/IdentificadorTipo' }
        identificadorValor: { type: string, minLength: 1 }
        nombre: { type: string, minLength: 1, maxLength: 100 }
        apellido: { type: string, minLength: 1, maxLength: 100 }
        razonSocial: { type: string, maxLength: 200 }
        telefono: { type: integer, minimum: 1, nullable: true }
        email: { type: string, format: email, nullable: true }
        jefeDeFamiliaId: { allOf: [{ $ref: '#/components/schemas/IdEntrada' }], description: Se ignora; el grupo familiar no se modifica por PUT }
        estado: { allOf: [{ $ref: '#/components/schemas/EstadoOperativo' }], description: Se ignora; usar desactivar/reactivar }
        inmobiliariaId: { allOf: [{ $ref: '#/components/schemas/IdEntrada' }], nullable: true }
    Persona:
      type: object
      required: [idPersona, nombre, apellido, razonSocial, identificadorTipo, identificadorValor, estado, inmobiliariaId, esPropietario, esInquilino, esJefeDeFamilia]
      properties:
        idPersona: { type: integer }
        nombre: { type: string }
        apellido: { type: string }
        razonSocial: { type: string }
        identificador: { type: string }
        identificadorTipo: { $ref: '#/components/schemas/IdentificadorTipo' }
        identificadorValor: { type: string }
        email: { type: string }
        telefono: { type: integer }
        contacto: { type: string }
        estado: { $ref: '#/components/schemas/EstadoOperativo' }
        createdAt: { type: string, format: date-time }
        inmobiliariaId: { type: integer, nullable: true, description: null = La Federala }
        inmobiliaria:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nombre: { type: string }
        esPropietario: { type: boolean }
        esInquilino: { type: boolean }
        esJefeDeFamilia: { type: boolean }
        jefeDeFamilia:
          type: object
          nullable: true
          properties:
            idPersona: { type: integer }
            nombre: { type: string }
            apellido: { type: string }
            cuil: { type: string }
        miembrosFamilia:
          type: array
          items:
            type: object
            properties:
              idPersona: { type: integer }
              nombre: { type: string }
              apellido: { type: string }
              cuil: { type: string }
    PersonaMutacionResponse:
      type: object
      required: [success, persona, message]
      properties:
        success: { type: boolean, enum: [true] }
        persona: { $ref: '#/components/schemas/Persona' }
        message: { type: string }
    GrupoFamiliar:
      type: object
      required: [titular, miembros]
      properties:
        titular:
          type: object
          properties:
            id: { type: integer }
            nombre: { type: string }
            apellido: { type: string }
            razonSocial: { type: string, nullable: true }
            identificadorTipo: { $ref: '#/components/schemas/IdentificadorTipo' }
            identificadorValor: { type: string }
        miembros:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              apellido: { type: string }
              identificadorTipo: { $ref: '#/components/schemas/IdentificadorTipo' }
              identificadorValor: { type: string }
    MiembroFamiliarCrear:
      type: object
      required: [nombre, apellido, identificadorTipo, identificadorValor]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        apellido: { type: string, minLength: 1, maxLength: 100 }
        identificadorTipo: { $ref: '#/components/schemas/IdentificadorTipo' }
        identificadorValor: { type: string, minLength: 1 }
    MiembroFamiliarCreado:
      type: object
      required: [id, nombre, apellido, identificadorTipo, identificadorValor]
      properties:
        id: { type: integer }
        nombre: { type: string }
        apellido: { type: string }
        identificadorTipo: { $ref: '#/components/schemas/IdentificadorTipo' }
        identificadorValor: { type: string }

    # ------------------------------------------------------------ Inmobiliarias
    InmobiliariaCrear:
      type: object
      required: [nombre, razonSocial]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        razonSocial: { type: string, minLength: 1, maxLength: 150 }
        contacto: { type: string, maxLength: 100 }
        comxventa:
          allOf: [{ $ref: '#/components/schemas/NumeroEntrada' }]
          nullable: true
          description: Comisión por venta (0 a 100); null equivale a 0.
        userId: { $ref: '#/components/schemas/IdEntrada' }
        maxPrioridadesActivas: { allOf: [{ $ref: '#/components/schemas/NumeroEntrada' }], nullable: true }
        estado: { allOf: [{ $ref: '#/components/schemas/EstadoOperativo' }], description: Default OPERATIVO }
    InmobiliariaActualizar:
      type: object
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        razonSocial: { type: string, minLength: 1, maxLength: 150 }
        contacto: { type: string, maxLength: 100 }
        comxventa: { allOf: [{ $ref: '#/components/schemas/NumeroEntrada' }], nullable: true }
        userId: { $ref: '#/components/schemas/IdEntrada' }
        maxPrioridadesActivas: { allOf: [{ $ref: '#/components/schemas/NumeroEntrada' }], nullable: true }
        estado: { $ref: '#/components/schemas/EstadoOperativo' }
        fechaBaja: { type: string, format: date-time, nullable: true }
    Inmobiliaria:
      type: object
      required: [idInmobiliaria, nombre, razonSocial, estado]
      properties:
        idInmobiliaria: { type: integer }
        nombre: { type: string }
        razonSocial: { type: string }
        contacto: { type: string }
        comxventa: { type: number, description: Comisión por venta (number); ausente si no está definida }
        maxPrioridadesActivas: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoOperativo' }
        fechaBaja: { type: string, format: date-time }
    InmobiliariaConMetricas:
      allOf:
        - $ref: '#/components/schemas/Inmobiliaria'
        - type: object
          properties:
            ventasTotales: { type: integer }
            ventasActivas: { type: integer }
            reservasTotales: { type: integer }
            reservasActivas: { type: integer }
            prioridadesTotales: { type: integer }
            prioridadesActivas: { type: integer }
            cantidadVentas: { type: integer, deprecated: true, description: Legacy; igual a ventasTotales }
            cantidadReservas: { type: integer, deprecated: true, description: Legacy; igual a reservasTotales }
    InmobiliariaMutacionResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data:
          type: object
          required: [inmobiliaria, message]
          properties:
            inmobiliaria: { $ref: '#/components/schemas/InmobiliariaConMetricas' }
            message: { type: string }

    # ------------------------------------------------------------ Usuarios
    UsuarioCrear:
      type: object
      required: [username, password, rol, email]
      properties:
        username: { type: string, minLength: 1, maxLength: 30 }
        password: { type: string, minLength: 6 }
        rol: { $ref: '#/components/schemas/Rol' }
        email: { type: string, format: email, maxLength: 100 }
    UsuarioActualizar:
      type: object
      minProperties: 1
      properties:
        username: { type: string, minLength: 1, maxLength: 30 }
        password: { type: string, minLength: 6 }
        rol: { $ref: '#/components/schemas/Rol' }
        email: { type: string, format: email, maxLength: 100 }
    Usuario:
      type: object
      description: Nunca incluye la contraseña.
      required: [id, username, email, role, createdAt]
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Rol' }
        createdAt: { type: string, format: date-time }

    # ------------------------------------------------------------ Fracciones y ubicaciones
    FraccionCrear:
      type: object
      required: [numero]
      properties:
        numero: { $ref: '#/components/schemas/IdEntrada' }
    FraccionActualizar:
      type: object
      minProperties: 1
      properties:
        numero: { $ref: '#/components/schemas/IdEntrada' }
    Fraccion:
      type: object
      required: [idFraccion, numero, lotes]
      properties:
        idFraccion: { type: integer }
        numero: { type: integer }
        lotes:
          type: array
          description: Lotes de la fracción (montos Decimal como string). Vacío en las respuestas de alta y edición.
          items: { type: object }
    FraccionMutacionResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/Fraccion' }
    Ubicacion:
      type: object
      required: [id, calle, numero]
      properties:
        id: { type: integer }
        calle: { $ref: '#/components/schemas/CalleUbicacion' }
        numero: { type: integer }
