openapi: 3.0.3
info:
  title: API Club de Campo La Federala (CCLF)
  version: 1.0.14
  description: >-
    API del backend de CCLF: lotes, promociones, reservas, ventas, pagos, prioridades, personas,
    inmobiliarias, usuarios, archivos, fracciones y ubicaciones.


    **Autenticación.** JWT en el header `Authorization: Bearer <token>`, obtenido con
    `POST /auth/login`. No se usan cookies. El acceso se evalúa con el
    estado vigente del usuario en cada request: un usuario eliminado, o el usuario de una
    inmobiliaria dada de baja (ELIMINADO), deja de operar aunque su token no haya vencido.


    **Autorización.** Cada operación declara en `x-roles` los roles admitidos por la ruta
    (`ADMINISTRADOR`, `GESTOR`, `INMOBILIARIA`, `TECNICO`). Un rol fuera de la lista recibe 403.
    Las reglas adicionales (tenant, campos permitidos por rol) se indican en la descripción.
    `INMOBILIARIA` opera solo dentro de su propia inmobiliaria.


    **Errores.** Formato `{ success: false, code, message }`, con `errors[]` en las validaciones.
    Una ruta o método inexistente responde 404 JSON `{ code: NOT_FOUND, message: "Ruta no encontrada" }`.
    El body JSON admite hasta 1 MB (413 `PAYLOAD_TOO_LARGE`); los archivos viajan por
    `multipart/form-data` con su propio límite (20 MB).


    **Montos.** Los campos Decimal de las entidades que se devuelven sin DTO (lotes, reservas,
    ofertas, promociones, ventas, plan de pago recién creado) se serializan como **string**
    (`"15000.5"`). El contexto de pagos, el registro de pagos, el reemplazo de plan y la comisión de
    inmobiliarias los devuelven como **number**.
servers:
  - url: http://localhost:3000/api
    description: Desarrollo local (las rutas de la API cuelgan de /api)

tags:
  - name: Health
    description: Liveness del proceso.
  - name: Auth
    description: Login con JWT Bearer.
  - name: Lotes
  - name: Promociones
    description: >-
      Promociones de precio sobre un lote. La expiración por fecha de fin la ejecuta el job programado
      de expiraciones (no hay endpoint manual).
  - name: Reservas
  - name: Ventas
  - name: Pagos
    description: Plan de pagos, cuotas, pagos y recargos de una venta.
  - name: Prioridades
    description: >-
      Prioridades sobre lotes. Al llegar `fechaFin` el job programado de expiraciones las expira con su
      lifecycle completo (prioridad EXPIRADA y lote restaurado si sigue CON_PRIORIDAD).
  - name: Personas
  - name: Inmobiliarias
  - name: Usuarios
    description: Administración de cuentas.
  - name: Files
    description: Documentos de lotes y ventas (BOLETO, ESCRITURA, PLANO, IMAGEN, OTRO).
  - name: Fracciones
  - name: Ubicaciones
    description: >-
      Solo lectura. Las ubicaciones se crean y modifican dentro del alta y la edición de lotes
      (`calle` + `numeroCalle`, o `ubicacionId`).

paths:
  # ============================================================ HEALTH
  /health:
    servers:
      - url: http://localhost:3000
        description: Fuera del prefijo /api
    get:
      tags: [Health]
      operationId: health
      summary: Liveness
      description: >-
        Indica que el proceso HTTP responde. No consulta la base de datos ni otros servicios: no es un
        chequeo de readiness ni de dependencias.
      security: []
      responses:
        '200':
          description: Proceso vivo
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  # ============================================================ AUTH
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Iniciar sesión
      description: >-
        Devuelve el usuario y un JWT. Credenciales inválidas, usuario inexistente y usuario de una
        inmobiliaria dada de baja (ELIMINADO) responden el mismo 401 genérico.


        Rate limit por cliente: 10 intentos fallidos cada 15 minutos; el siguiente responde 429.
        Los logins exitosos no consumen cupo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: usuario@example.com, password: clave-de-ejemplo }
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LoginData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Credenciales inválidas (mismo body para todos los motivos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: UNAUTHORIZED, message: Credenciales inválidas }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================ LOTES
  /lotes:
    get:
      tags: [Lotes]
      operationId: listarLotes
      summary: Listar lotes
      description: >-
        TECNICO no puede usar el filtro `deudor` (400) y su respuesta omite `deuda`, ventas y reservas.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA, TECNICO]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoLoteEntrada' } }
        - { name: subestado, in: query, schema: { $ref: '#/components/schemas/SubestadoLoteEntrada' } }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoLoteEntrada' } }
        - { name: ocupacion, in: query, schema: { $ref: '#/components/schemas/Ocupacion' } }
        - { name: propietarioId, in: query, schema: { $ref: '#/components/schemas/IdQuery' } }
        - { name: ubicacionId, in: query, schema: { $ref: '#/components/schemas/IdQuery' } }
        - name: deudor
          in: query
          description: true = solo lotes con deuda; false = sin deuda. No disponible para TECNICO (400).
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Lotes
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [lotes, total]
                    properties:
                      lotes: { type: array, items: { $ref: '#/components/schemas/Lote' } }
                      total: { type: integer, description: Cantidad devuelta }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Lotes]
      operationId: crearLote
      summary: Crear lote
      description: >-
        La ubicación se asocia con `ubicacionId` (existente) o se crea con `calle` + `numeroCalle`;
        `ubicacionId` tiene prioridad. `precio` es obligatorio para "Lote Venta" y no se admite para
        "Espacio Comun".
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoteCrear' }
      responses:
        '201':
          description: Lote creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoteMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /lotes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Lotes]
      operationId: obtenerLote
      summary: Obtener lote
      description: Para TECNICO la respuesta omite `deuda`, ventas y reservas.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA, TECNICO]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lote
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/Lote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Lotes]
      operationId: actualizarLote
      summary: Actualizar lote
      description: >-
        Actualización parcial (al menos un campo). TECNICO solo puede modificar `subestado` y
        `superficie`; si no envía ninguno de ellos recibe 403. `calle` + `numeroCalle` actualizan la
        ubicación existente o crean una; `ubicacionId` conecta una existente.
      x-roles: [ADMINISTRADOR, GESTOR, TECNICO]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoteActualizar' }
      responses:
        '200':
          description: Lote actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoteMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Lotes]
      operationId: eliminarLote
      summary: Eliminar lote definitivamente
      description: >-
        Borrado físico del lote, solo si no tiene historia ni asociaciones: ventas, reservas (y sus
        ofertas), prioridades, promociones, alquileres o archivos, en cualquier estado (incluidos los
        dados de baja). Si tiene alguna responde 409 y no borra nada. La ubicación del lote no bloquea
        (queda sin lote asignado). Solo ADMINISTRADOR.
      x-roles: [ADMINISTRADOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lote eliminado
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: Lote eliminado exitosamente }
                  data:
                    type: object
                    properties:
                      message: { type: string, example: Lote eliminado correctamente }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El lote tiene operaciones o asociaciones registradas; no se borró nada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictResponse' }
              example:
                success: false
                code: CONFLICT
                message: No se puede eliminar el lote porque tiene operaciones o asociaciones registradas (ventas, reservas, prioridades, promociones, alquileres o archivos).
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================ PROMOCIONES
  /lotes/{id}/promociones/aplicar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Promociones]
      operationId: aplicarPromocion
      summary: Aplicar promoción a un lote
      description: >-
        El lote debe estar DISPONIBLE, tener precio y no tener otra promoción activa. Pasa a
        EN_PROMOCION con el precio promocional.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromocionAplicar' }
      responses:
        '201':
          description: Promoción aplicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromocionMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /lotes/{id}/promociones/quitar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Promociones]
      operationId: quitarPromocion
      summary: Quitar la promoción activa
      description: Restaura el estado y el precio anteriores del lote.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Promoción quitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromocionMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /lotes/{id}/promociones/activa:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Promociones]
      operationId: obtenerPromocionActiva
      summary: Obtener la promoción activa de un lote
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA, TECNICO]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Promoción activa, o `data` null si no hay
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    allOf: [{ $ref: '#/components/schemas/Promocion' }]
                    nullable: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================ RESERVAS
  /reservas:
    get:
      tags: [Reservas]
      operationId: listarReservas
      summary: Listar reservas
      description: INMOBILIARIA ve solo las reservas de su inmobiliaria.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoReserva' } }
        - { name: estadoOperativo, in: query, schema: { $ref: '#/components/schemas/EstadoOperativo' } }
        - { name: loteId, in: query, schema: { $ref: '#/components/schemas/IdQuery' } }
      responses:
        '200':
          description: Reservas
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [reservas, total]
                    properties:
                      reservas: { type: array, items: { $ref: '#/components/schemas/Reserva' } }
                      total: { type: integer, description: Cantidad devuelta }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Reservas]
      operationId: crearReserva
      summary: Crear reserva
      description: >-
        Para INMOBILIARIA la reserva queda siempre a nombre de su inmobiliaria (se ignora
        `inmobiliariaId`). Para staff, `inmobiliariaId` debe ser una inmobiliaria OPERATIVO: una
        ELIMINADO responde 409 "La inmobiliaria seleccionada no está disponible para operar."


        El lote debe estar DISPONIBLE, EN_PROMOCION o CON_PRIORIDAD (400) y sin otra reserva vigente
        (409). Un lote con prioridad solo lo reserva el dueño de la prioridad (403).
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaCrear' }
      responses:
        '201':
          description: Reserva creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /reservas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reservas]
      operationId: obtenerReserva
      summary: Obtener reserva
      description: INMOBILIARIA solo accede a reservas de su inmobiliaria (403).
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/Reserva' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Reservas]
      operationId: actualizarReserva
      summary: Actualizar reserva
      description: >-
        Actualización parcial (al menos un campo). No se puede cambiar `loteId` ni `inmobiliariaId`
        de una reserva creada (400); reenviar el mismo valor no es un cambio. Los cambios de `estado`
        respetan las transiciones del lifecycle (400/409).
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaActualizar' }
      responses:
        '200':
          description: Reserva actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /reservas/inmob/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la inmobiliaria
        schema: { $ref: '#/components/schemas/IdPath' }
    get:
      tags: [Reservas]
      operationId: listarReservasPorInmobiliaria
      summary: Listar reservas de una inmobiliaria
      description: INMOBILIARIA solo puede consultar su propia inmobiliaria (403).
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reservas de la inmobiliaria
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { type: array, items: { $ref: '#/components/schemas/Reserva' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /reservas/{id}/eliminar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Reservas]
      operationId: eliminarReserva
      summary: Dar de baja una reserva (baja lógica)
      description: >-
        Marca `estadoOperativo` ELIMINADO. Solo reservas CANCELADA, EXPIRADA o RECHAZADA (409); una ya
        eliminada responde 409. INMOBILIARIA solo sobre las propias (403).
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reserva dada de baja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /reservas/{id}/reactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Reservas]
      operationId: reactivarReserva
      summary: Reactivar una reserva dada de baja
      description: Vuelve `estadoOperativo` a OPERATIVO (409 si no estaba eliminada). INMOBILIARIA solo sobre las propias.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reserva reactivada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /reservas/{id}/ofertas:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reservas]
      operationId: listarOfertasReserva
      summary: Listar ofertas de una reserva
      description: INMOBILIARIA solo sobre reservas propias (403).
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ofertas (más reciente primero)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { type: array, items: { $ref: '#/components/schemas/OfertaReserva' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Reservas]
      operationId: crearOfertaReserva
      summary: Registrar oferta, contraoferta, aceptación o rechazo
      description: INMOBILIARIA solo sobre reservas propias (403). Una reserva ya consumida por una venta no admite ofertas (400).
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfertaCrear' }
      responses:
        '201':
          description: Oferta registrada
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: Oferta registrada }
                  data:
                    type: object
                    required: [oferta, reserva]
                    properties:
                      oferta: { $ref: '#/components/schemas/OfertaReserva' }
                      reserva: { $ref: '#/components/schemas/Reserva' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================ VENTAS
  /ventas:
    get:
      tags: [Ventas]
      operationId: listarVentas
      summary: Listar ventas
      description: Sin `estadoOperativo` devuelve solo ventas OPERATIVO.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoVenta' } }
        - { name: estadoOperativo, in: query, schema: { $ref: '#/components/schemas/EstadoOperativo' } }
        - { name: loteId, in: query, schema: { $ref: '#/components/schemas/IdQuery' } }
      responses:
        '200':
          description: Ventas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VentaListaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Ventas]
      operationId: crearVenta
      summary: Crear venta
      description: >-
        Requiere al menos un comprador (`compradores[]` o `compradorId`). Si el lote tiene una reserva
        vigente de una inmobiliaria, la venta debe ser de esa misma inmobiliaria y por el monto de la
        reserva (400). `inmobiliariaId` debe ser una inmobiliaria OPERATIVO: una ELIMINADO responde
        409 "La inmobiliaria seleccionada no está disponible para operar."
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VentaCrear' }
      responses:
        '201':
          description: Venta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VentaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /ventas/inmobiliaria/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la inmobiliaria
        schema: { $ref: '#/components/schemas/IdPath' }
    get:
      tags: [Ventas]
      operationId: listarVentasPorInmobiliaria
      summary: Listar ventas de una inmobiliaria
      description: INMOBILIARIA solo puede consultar su propia inmobiliaria (403). Sin resultados responde 404.
      x-roles: [ADMINISTRADOR, GESTOR, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estadoOperativo, in: query, schema: { $ref: '#/components/schemas/EstadoOperativo' } }
      responses:
        '200':
          description: Ventas de la inmobiliaria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VentaListaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /ventas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Ventas]
      operationId: obtenerVenta
      summary: Obtener venta
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Venta
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/Venta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Ventas]
      operationId: actualizarVenta
      summary: Actualizar venta
      description: >-
        Actualización parcial (al menos un campo). Los cambios de `estado` respetan las transiciones
        válidas. Reasignar `inmobiliariaId` a una inmobiliaria ELIMINADO responde 409; reenviar la
        inmobiliaria actual de una venta histórica no es una reasignación.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VentaActualizar' }
      responses:
        '200':
          description: Venta actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VentaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /ventas/{id}/eliminar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Ventas]
      operationId: eliminarVenta
      summary: Dar de baja una venta (baja lógica)
      description: Marca `estadoOperativo` ELIMINADO si el estado de la venta lo permite (409).
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Venta dada de baja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VentaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /ventas/{id}/reactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Ventas]
      operationId: reactivarVenta
      summary: Reactivar una venta dada de baja
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Venta reactivada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VentaMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================ PAGOS
  /ventas/{ventaId}/pagos:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    get:
      tags: [Pagos]
      operationId: obtenerContextoPagos
      summary: Contexto de pagos de una venta
      description: Plan vigente, cuotas, pagos, planes históricos y resumen. Montos como number. Venta eliminada → 409.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Contexto de pagos
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/ContextoPagos' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Pagos]
      operationId: registrarPago
      summary: Registrar un pago sobre una cuota
      description: Venta eliminada → 409.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PagoRegistrar' }
      responses:
        '201':
          description: Pago registrado (montos como number)
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: Pago registrado correctamente }
                  data: { $ref: '#/components/schemas/PagoRegistrado' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /ventas/{ventaId}/pagos/recargo:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    post:
      tags: [Pagos]
      operationId: aplicarRecargo
      summary: Aplicar un recargo manual a una cuota
      description: Venta eliminada → 409.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecargoAplicar' }
      responses:
        '201':
          description: Recargo aplicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MensajeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /ventas/{ventaId}/pagos/plan:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    post:
      tags: [Pagos]
      operationId: crearPlanPago
      summary: Crear el plan de pago inicial
      description: >-
        La suma de las cuotas debe coincidir con el monto esperado según el tipo de financiación (400).
        Venta eliminada o con plan vigente → 409. La respuesta es el plan tal como queda persistido:
        sus montos son Decimal serializados como string.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanPagoCrear' }
      responses:
        '201':
          description: Plan creado
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: Plan de pago creado exitosamente }
                  data: { $ref: '#/components/schemas/PlanPagoPersistido' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /ventas/{ventaId}/pagos/plan/reemplazar:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    post:
      tags: [Pagos]
      operationId: reemplazarPlanPago
      summary: Reemplazar el plan de pago vigente
      description: El plan nuevo cubre el saldo pendiente real; el anterior queda REEMPLAZADO. Montos como number.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanPagoReemplazar' }
      responses:
        '201':
          description: Plan reemplazado
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: Plan de pago reemplazado correctamente }
                  data: { $ref: '#/components/schemas/ReemplazoPlanResultado' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================ FILES
  /files:
    post:
      tags: [Files]
      operationId: subirArchivo
      summary: Subir archivo
      description: >-
        `multipart/form-data` con el archivo en el campo `file` (PDF, JPG/JPEG, PNG o WebP; máx. 20 MB).
        BOLETO, ESCRITURA y OTRO requieren `ventaId` de una venta del mismo lote; PLANO e IMAGEN no lo
        admiten. TECNICO solo puede subir PLANO e IMAGEN (403).
      x-roles: [ADMINISTRADOR, GESTOR, TECNICO]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ArchivoSubir' }
      responses:
        '201':
          description: Archivo subido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchivoMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/FilesInternalError' }
  /files/venta/{ventaId}:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    get:
      tags: [Files]
      operationId: listarArchivosPorVenta
      summary: Listar archivos de una venta
      description: >-
        INMOBILIARIA solo para ventas de su inmobiliaria (404 si no lo es). TECNICO solo recibe PLANO e
        IMAGEN. `includeDeleted` solo tiene efecto para ADMINISTRADOR y GESTOR.
      x-roles: [ADMINISTRADOR, GESTOR, TECNICO, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoArchivo' } }
        - { name: includeDeleted, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Archivos (array, sin envoltorio)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Archivo' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/FilesInternalError' }
  /files/lote/{idLoteAsociado}:
    parameters:
      - name: idLoteAsociado
        in: path
        required: true
        schema: { $ref: '#/components/schemas/IdPath' }
    get:
      tags: [Files]
      operationId: listarArchivosPorLote
      summary: Listar archivos de un lote
      description: >-
        Cada rol recibe solo los tipos que puede ver (TECNICO: PLANO e IMAGEN; INMOBILIARIA: documentos
        de lote y de ventas propias). `includeDeleted` solo tiene efecto para ADMINISTRADOR y GESTOR.
      x-roles: [ADMINISTRADOR, GESTOR, TECNICO, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: includeDeleted, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Archivos (array, sin envoltorio)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Archivo' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/FilesInternalError' }
  /files/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Files]
      operationId: obtenerArchivo
      summary: Obtener metadata de un archivo
      description: Un archivo que el rol no puede ver responde 404 (TECNICO fuera de PLANO/IMAGEN, INMOBILIARIA fuera de sus ventas).
      x-roles: [ADMINISTRADOR, GESTOR, TECNICO, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Archivo (sin envoltorio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Archivo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/FilesInternalError' }
    delete:
      tags: [Files]
      operationId: eliminarArchivo
      summary: Dar de baja un archivo (baja lógica)
      description: Lo marca ELIMINADO; se puede restaurar. Para borrarlo del storage usar `DELETE /files/{id}/purge`.
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Archivo dado de baja }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/FilesInternalError' }
  /files/{id}/url:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Files]
      operationId: generarUrlFirmada
      summary: Generar URL firmada de descarga
      description: Solo archivos OPERATIVO que el rol puede ver (404 si no). La URL es temporal; `expiresAt` indica su vencimiento.
      x-roles: [ADMINISTRADOR, GESTOR, TECNICO, INMOBILIARIA]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: URL firmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlFirmada' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/FilesInternalError' }
  /files/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Files]
      operationId: restaurarArchivo
      summary: Restaurar un archivo dado de baja
      x-roles: [ADMINISTRADOR, GESTOR]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Archivo restaurado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchivoMutacionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/FilesInternalError' }
  /files/{id}/purge:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Files]
      operationId: purgarArchivo
      summary: Borrar un archivo definitivamente (storage y metadata)
      x-roles: [ADMINISTRADOR]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Archivo purgado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/FilesInternalError' }
  /files/{id}/aprobaciones:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Files]
      operationId: actualizarAprobacionArchivo
      summary: Actualizar la aprobación de un plano
      description: >-
        Solo archivos PLANO (400). `COMISION` lo pueden aprobar ADMINISTRADOR, GESTOR y TECNICO;
        `MUNICIPIO`, solo ADMINISTRADOR y GESTOR (403).
      x-roles: [ADMINISTRADOR, GESTOR, TECNICO]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AprobacionActualizar' }
      responses:
        '200':
          description: Aprobación actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchivoMutacionResponse' }
